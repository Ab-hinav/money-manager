name: Build and Deploy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'terraform/**'  # Don't re-deploy app if we only changed infrastructure
      - 'docs/**'

env:
  # Change this to your Docker Hub username
  DOCKER_USER: abhi7dev 
  BACKEND_IMAGE: money-manager-backend
  FRONTEND_IMAGE: money-manager-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USER }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_USER }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (K3s)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Update the Deployment (Force pull new image)
            # We assume you have a 'deployment.yaml' applied on the server.
            # If not, we can apply it right here.
            
            echo "Restarting K3s Deployments..."
            kubectl rollout restart deployment/money-backend
            kubectl rollout restart deployment/money-frontend
            
            # Verify
            kubectl get pods