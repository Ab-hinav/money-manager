name: Build and Deploy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'terraform/**'  # Don't re-deploy app if we only changed infrastructure
      - 'docs/**'

env:
  # Change this to your Docker Hub username
  DOCKER_USER: abhi7dev 
  BACKEND_IMAGE: money-manager-backend
  FRONTEND_IMAGE: money-manager-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USER }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_USER }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (K3s)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Create directory if missing
            mkdir -p k8s
            
            # 2. We need to get the new YAML files onto the server. 
            # Ideally, we git clone. For simplicity, we can just pull the images 
            # and use a one-liner to update, OR simpler:
            # We will use 'kubectl' to apply from the repo if we clone it, 
            # BUT simplest for Phase 1: 
            # Just force a restart for now, assuming you copied the YAMLs once.
            
            # actually, let's do this properly:
            # Clone/Pull the latest code on the server to get the YAMLs
            if [ -d "money-manager" ]; then
              cd money-manager
              git pull origin main
            else
              # You need to use a Personal Access Token (PAT) for private repos
              # For now, let's assume we just update images:
              echo "Skipping git pull (complex auth). Updating images..."
            fi

            # Force update images
            kubectl set image deployment/money-backend backend=${{ env.DOCKER_USER }}/${{ env.BACKEND_IMAGE }}:latest
            kubectl set image deployment/money-frontend frontend=${{ env.DOCKER_USER }}/${{ env.FRONTEND_IMAGE }}:latest
            
            # Restart to pick up changes
            kubectl rollout restart deployment/money-backend
            kubectl rollout restart deployment/money-frontend